<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kestral</title>
    <script>
      // Dunkel/Hell frueh setzen, um Aufflackern beim Start zu vermeiden.
      // Respektiert die gespeicherte Auswahl (kestral-theme), sonst System.
      (function () {
        try {
          const t = localStorage.getItem("kestral-theme");
          const dark =
            t === "dark" ||
            ((t === "system" || !t) && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <style>
      /* Paint the theme background before the CSS bundle loads, so there is no
         white flash while the app boots. Matches --bg of .t-dark and .t-light in src/tokens.css. */
      html {
        background: #111111;
      }
      html:not(.dark) {
        background: #FAF9F5;
      }
      /* Fill the window exactly: no body margin frame, no outer scrollbar. The
         app's own panes scroll internally. */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
