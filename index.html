<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kestral</title>
    <script>
      // Dunkel/Hell frueh setzen, um Aufflackern beim Start zu vermeiden.
      // Respektiert die gespeicherte Auswahl (kestral-theme), sonst System.
      (function () {
        try {
          const t = localStorage.getItem("kestral-theme");
          const dark =
            t === "dark" ||
            ((t === "system" || !t) && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <style>
      /* Paint the theme background before the CSS bundle loads, so there is no
         white flash while the app boots. Matches the reui --background tokens. */
      html {
        background: #0a0a0a;
      }
      html:not(.dark) {
        background: #ffffff;
      }
    </style>
  </head>

  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
