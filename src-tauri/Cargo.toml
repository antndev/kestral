[package]
name = "kestral"
version = "0.2.12"
description = "SSH client with an encrypted vault and a built-in MCP server for controlled AI access"
authors = ["antndev <antonkonig691@gmail.com>"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/antndev/kestral"

[lib]
name = "kestral_lib"
# Desktop only: the binary links the library as an rlib. The staticlib and
# cdylib types are for mobile targets, and building them makes every build
# compile this crate several times over, so drop them.
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-drag = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

rmcp = { version = "1.8", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.0"
axum = "0.8"
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process"] }

thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
tracing = "0.1"
tracing-subscriber = "0.3"

russh = { version = "0.61", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2"
signature = "3.0.0"
# Same versions russh already uses; needed to match hashed known_hosts entries.
hmac = "0.13"
sha1 = "0.11"

argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
subtle = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Security_Credentials", "Security_Cryptography", "Storage_Streams", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_LibraryLoader"] }

# Optimise for build time over the last bit of runtime speed. This is a desktop
# SSH client, so lighter codegen and more parallel units cut CI build time a lot
# without any noticeable difference in use.
[profile.release]
opt-level = 1
codegen-units = 256
strip = true

# The KDF is deliberately CPU bound; keep it fully optimised so unlock stays fast.
[profile.release.package.argon2]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.argon2]
opt-level = 3
