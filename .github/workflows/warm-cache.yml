name: Warm cache

# Builds the Rust dependency tree on main so tag-triggered release builds can
# restore the cache instead of compiling everything cold. Release runs live on
# tag refs, which cannot share caches with one another; the default branch can,
# so this keeps a warm cache there under the same shared-key the release uses.

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "package-lock.json"
      - ".github/workflows/warm-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: release-build
          cache-on-failure: true

      # generate_context! embeds the frontend, so it must exist before the Rust
      # build. Building it here also mirrors the release build exactly, so the
      # cached dependency artifacts match.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Build release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
